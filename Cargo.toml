[workspace]
members = ["crates/smbs", "crates/smbs-cli"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
# std::fs::File::try_lock (request pacing) is stable from 1.89.
rust-version = "1.89"
license = "Elastic-2.0"
repository = "https://github.com/cpaikr/smbs"

[workspace.dependencies]
clap = { version = "4.6.10", features = ["derive"] }
encoding_rs = "0.8.44"
flate2 = "1.1.11"
roxmltree = "0.21.2"
rust_xlsxwriter = "0.104.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
# smbs.biz serves these pages over plain HTTP only (its HTTPS certificate does
# not validate), so the SDK compiles no TLS backend. The CLI enables rustls
# for GitHub release checks and upgrades only.
ureq = { version = "3.5.2", default-features = false }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
